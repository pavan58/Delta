name: DriverFare – test, build & deploy to GitHub Pages

on:
  push:
    paths: ["driverfare/**", ".github/workflows/driverfare-pages.yml"]
  pull_request:
    paths: ["driverfare/**", ".github/workflows/driverfare-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the build to the gh-pages branch

concurrency:
  group: driverfare-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: driverfare

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driverfare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Publish dist/ to the gh-pages branch (GitHub Pages source), only from the default branch.
      - name: Publish to gh-pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy DriverFare from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
