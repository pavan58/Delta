name: DriverFare – test, build & deploy to GitHub Pages

on:
  push:
    paths: ["driverfare/**", ".github/workflows/driverfare-pages.yml"]
  pull_request:
    paths: ["driverfare/**", ".github/workflows/driverfare-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: driverfare-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: driverfare

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: driverfare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: driverfare/dist

  deploy:
    # Only the default branch is published; other branches just test and build.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
