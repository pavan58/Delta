name: Azure Gigs CI

on:
  push:
    paths: ["azure-gigs/**", ".github/workflows/azure-gigs-ci.yml"]
  pull_request:
    paths: ["azure-gigs/**", ".github/workflows/azure-gigs-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: azure-gigs

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: azuregigs
          POSTGRES_PASSWORD: azuregigs
          POSTGRES_DB: azuregigs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U azuregigs" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://azuregigs:azuregigs@localhost:5432/azuregigs_test?schema=public
      TEST_DATABASE_URL: postgresql://azuregigs:azuregigs@localhost:5432/azuregigs_test?schema=public
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azure-gigs/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: azure-gigs/test-results
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t azure-gigs:ci .
      - run: docker build --target tools -t azure-gigs-tools:ci .
